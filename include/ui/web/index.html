<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Integer Set Lab - Web</title>
</head>
<body class="bg-gray-50 min-h-screen p-4 md:p-8 text-gray-800">
    <div class="max-w-4xl mx-auto">
        <header class="mb-8 flex justify-between items-end">
            <div>
                <h1 class="text-3xl font-bold text-gray-900 tracking-tight">Integer Set Lab</h1>
                <p class="text-gray-500">Hexagonal Architecture - Web Wrap</p>
            </div>
            <div id="status" class="text-xs font-mono px-2 py-1 bg-green-100 text-green-700 rounded">API ONLINE</div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Left Column: Create -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400 mb-4">Create Set</h2>
                <input type="text" id="setInput" placeholder="e.g. 1 5 10 42" 
                       class="w-full px-4 py-2 border rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition mb-3">
                <button onclick="createSet()" 
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-xl transition shadow-sm active:scale-95">
                    Save to Database
                </button>
            </div>

            <!-- Middle Column: DB List -->
            <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col h-[400px]">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400">Database Entries</h2>
                    <button onclick="refreshList()" class="text-blue-600 text-sm hover:underline">Refresh</button>
                </div>
                <div class="overflow-y-auto flex-grow rounded-xl border border-gray-50">
                    <table class="w-full text-left">
                        <thead class="sticky top-0 bg-gray-50 text-xs text-gray-500">
                            <tr>
                                <th class="p-3">ID</th>
                                <th class="p-3">Elements</th>
                                <th class="p-3 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="setTableBody">
                            <!-- Rows loaded via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Bottom: Batch Math -->
            <div class="md:col-span-3 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                    <div>
                        <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400 mb-1">Batch Operations</h2>
                        <p class="text-xs text-gray-500 italic">Select multiple sets in the list above to perform math.</p>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="performMath('union')" class="px-6 py-2 bg-gray-800 text-white rounded-xl hover:bg-black transition">Union</button>
                        <button onclick="performMath('intersect')" class="px-6 py-2 bg-gray-800 text-white rounded-xl hover:bg-black transition">Intersect</button>
                        <button onclick="performMath('difference')" class="px-6 py-2 bg-gray-800 text-white rounded-xl hover:bg-black transition">Difference</button>
                    </div>
                </div>
                <div id="resultArea" class="mt-4 p-4 bg-gray-50 rounded-xl font-mono text-center text-gray-400 border border-dashed border-gray-200">
                    RESULT: NO CALCULATION PERFORMED
                </div>
            </div>
        </div>
    </div>
</body>
</html>
